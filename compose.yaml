services:
  postgres:
    image: postgres:18.6
    container_name: workout-tracker-postgres
    environment:
      POSTGRES_DB: workout_tracker
      POSTGRES_USER: workout_user
      POSTGRES_PASSWORD: workout_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workout_user -d workout_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10